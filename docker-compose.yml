services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer123
      POSTGRES_DB: gno_indexer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d gno_indexer"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4567:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack-setup:
    image: localstack/localstack:latest
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: /bin/bash
    command: -c "sleep 5 && awslocal sqs create-queue --queue-name token-events --region ap-northeast-2 && echo 'SQS queue created successfully'"
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  block-synchronizer:
    build:
      context: .
      dockerfile: services/block-synchronizer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      localstack-setup:
        condition: service_completed_successfully
    env_file:
      - services/block-synchronizer/config/.env.example
    restart: unless-stopped

  event-processor:
    build:
      context: .
      dockerfile: services/event-processor/Dockerfile
    env_file:
      - services/event-processor/config/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      localstack-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: 2

  balance-api:
    build:
      context: .
      dockerfile: services/balance-api/Dockerfile
    env_file:
      - services/balance-api/config/.env.example
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
